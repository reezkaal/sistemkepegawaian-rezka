<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application User Flow — HRIS PPSDMPU</title>
  <meta name="description" content="Alur penggunaan utama PPSDMPU-HRIS dari login hingga pengelolaan informasi kepegawaian: Dashboard, Pegawai, Detail Pegawai, Cuti, dan Logout.">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      font-family: 'Geist', sans-serif;
      color: #2d3142;
      padding: 48px 32px 64px;
      min-height: 100vh;
    }
    .page { max-width: 900px; margin: 0 auto; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7a8399;
      margin-bottom: 10px;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #2d3142;
      margin-bottom: 6px;
    }
    .subtitle {
      font-family: 'Geist', sans-serif;
      font-size: 13px;
      color: #4f5d75;
      margin-bottom: 40px;
    }
    .diagram-wrap { width: 100%; overflow-x: auto; }
    svg { display: block; max-width: 100%; }
    .footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid rgba(45,49,66,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer p {
      font-family: 'Geist Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.10em;
      color: #7a8399;
    }
  </style>
</head>
<body>
<div class="page">
  <p class="eyebrow">PPSDMPU · HRIS · ALUR PENGGUNA</p>
  <h1>Application User Flow</h1>
  <p class="subtitle">Alur penggunaan utama PPSDMPU-HRIS dari login hingga pengelolaan informasi kepegawaian</p>

  <div class="diagram-wrap">
    <!--
      type-flowchart — Application User Flow
      Source-verified navigation from App.tsx, Sidebar.tsx, EmployeeTable.tsx,
      EmployeeQuickSearch.tsx, EmployeeDetail.tsx, Dashboard.tsx.

      Shapes:
        Oval (rx=20)  — start / end
        Rect (rx=6)   — page / action
        Diamond       — decision / navigation choice (≤3 exits)
        Filled dot    — merge point

      Color rule:
        Coral accent → happy-path entry flow (Start→Login→Dashboard) only.
        All other shapes: default ink/paper.

      Layout: top-to-bottom, centered column, branching at Dashboard.

      viewBox: 0 0 800 820

      Key x-coordinates (centered column cx=400):
        cx-main = 400

      Key y-coordinates:
        Start:           y=30   (oval, cx=400)
        Login:           y=110  (rect, cx=400)
        arrow y=150
        Dashboard:       y=190  (rect, cx=400, ACCENT)
        "Navigasi" note: y=258
        Branch diamond:  y=290  (cx=400) — "Pilih Halaman"
        Left: Pegawai:   cx=160, y=390 (rect)
        Center: Cuti:    cx=400, y=390 (rect)
        Right: (back to Dashboard)

        Detail Pegawai:  cx=160, y=500 (rect)
          triggered from: Pegawai (tabel row) OR Dashboard QuickSearch

        Merge dot:       cx=400, y=600
        Logout:          cx=400, y=660 (rect, via sidebar always available)
        End:             cx=400, y=740 (oval)

      All routing decisions source-verified:
        - Sidebar NavItems: /dashboard, /pegawai, /cuti (always accessible from protected pages)
        - EmployeeTable onClick -> /pegawai/${nip}
        - EmployeeQuickSearch onClick -> /pegawai/${nip} (from Dashboard directly)
        - EmployeeDetail "Kembali" button -> navigate('/pegawai')
        - Sidebar Logout button -> handleConfirmLogout -> navigate('/login', replace)
    -->
    <svg
      viewBox="0 0 800 820"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="uf-title uf-desc"
      style="width:100%; height:auto;"
    >
      <title id="uf-title">Application User Flow HRIS PPSDMPU</title>
      <desc id="uf-desc">Flowchart alur pengguna PPSDMPU-HRIS: pengguna memulai dari login, masuk ke Dashboard yang menampilkan statistik kepegawaian dan widget pencarian cepat, kemudian dapat berpindah ke halaman Pegawai untuk melihat daftar dan mencari data pegawai, ke halaman Detail Pegawai dari tabel atau QuickSearch Dashboard, atau ke halaman Cuti untuk melihat rekap penggunaan cuti. Dari semua halaman pengguna dapat logout melalui sidebar.</desc>

      <defs>
        <!-- arrow marker filled -->
        <marker id="uf-arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill="#4f5d75"/>
        </marker>
        <!-- accent arrow marker -->
        <marker id="uf-arr-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill="#eb6c36"/>
        </marker>
        <!-- muted dashed return arrow -->
        <marker id="uf-arr-return" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill="#7a8399"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="800" height="820" fill="#f5f5f5"/>

      <!-- ─── SIDEBAR AVAILABILITY BAND ─────────────────────────────── -->
      <!--
        Vertical band on left indicating "sidebar always available
        from all protected pages". Subtle tint, not a swim lane.
      -->
      <rect x="28" y="182" width="110" height="464" rx="4"
            fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.10)"
            stroke-width="0.8" stroke-dasharray="3,4"/>
      <text x="83" y="201" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.10em">SIDEBAR</text>
      <text x="83" y="213" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.10em">TERSEDIA</text>

      <!-- sidebar nav items listed inside the band -->
      <!-- Dashboard item -->
      <rect x="44" y="232" width="78" height="20" rx="4"
            fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.15)" stroke-width="0.7"/>
      <text x="83" y="246" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.04em">Dashboard</text>

      <!-- Pegawai item -->
      <rect x="44" y="262" width="78" height="20" rx="4"
            fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.15)" stroke-width="0.7"/>
      <text x="83" y="276" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.04em">Pegawai</text>

      <!-- Cuti item -->
      <rect x="44" y="292" width="78" height="20" rx="4"
            fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.15)" stroke-width="0.7"/>
      <text x="83" y="306" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.04em">Cuti</text>

      <!-- divider in band -->
      <line x1="44" y1="330" x2="122" y2="330"
            stroke="rgba(45,49,66,0.10)" stroke-width="0.7"/>

      <!-- Logout item in band -->
      <rect x="44" y="340" width="78" height="20" rx="4"
            fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.7"/>
      <text x="83" y="354" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.04em">Logout</text>

      <!-- bracket/brace connecting sidebar band to protected pages zone -->
      <line x1="138" y1="242" x2="152" y2="242"
            stroke="rgba(45,49,66,0.15)" stroke-width="0.8"/>
      <line x1="152" y1="188" x2="152" y2="650"
            stroke="rgba(45,49,66,0.15)" stroke-width="0.8" stroke-dasharray="2,4"/>

      <!-- ─── NODES ─────────────────────────────────────────────────── -->

      <!--
        START (oval): cx=400, y=20..56
        rx=20 → oval pill shape
      -->
      <ellipse cx="400" cy="38" rx="52" ry="20"
               fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="400" y="43" fill="#eb6c36" font-size="10" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle"
            letter-spacing="0.06em">MULAI</text>

      <!-- arrow: Start → Login -->
      <line x1="400" y1="58" x2="400" y2="94"
            stroke="#eb6c36" stroke-width="1.2" marker-end="url(#uf-arr-accent)"/>

      <!--
        LOGIN page (rect): cx=400, y=98..138
        w=160, h=40 → x=320, y=98
      -->
      <rect x="310" y="98" width="180" height="40" rx="6"
            fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="400" y="115" fill="#2d3142" font-size="11" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">/login</text>
      <text x="400" y="130" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.06em">Masukkan username &amp; password</text>

      <!-- arrow: Login → Dashboard (accent, happy-path) -->
      <line x1="400" y1="138" x2="400" y2="174"
            stroke="#eb6c36" stroke-width="1.2" marker-end="url(#uf-arr-accent)"/>
      <!-- label on arrow -->
      <rect x="344" y="148" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="157" fill="#eb6c36" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Login berhasil</text>

      <!--
        DASHBOARD page (rect): cx=400, y=178..228
        w=200, h=50 → x=300, y=178
        ACCENT: the focal node
      -->
      <rect x="288" y="178" width="224" height="50" rx="6"
            fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="400" y="199" fill="#2d3142" font-size="11" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">/dashboard</text>
      <text x="400" y="213" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Statistik pegawai · Cuti summary</text>
      <text x="400" y="224" fill="#7a8399" font-size="7.5"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">EmployeeQuickSearch tersedia</text>

      <!-- ─── BRANCHING FROM DASHBOARD ──────────────────────────── -->

      <!-- arrow down: Dashboard → branch diamond -->
      <line x1="400" y1="228" x2="400" y2="274"
            stroke="#4f5d75" stroke-width="1.0" marker-end="url(#uf-arr)"/>

      <!--
        DECISION DIAMOND: "Pilih halaman" cx=400, y=290
        Diamond: points form a rhombus. Half-width=70, half-height=30
        Points: top(400,264), right(470,294), bottom(400,324), left(330,294)
      -->
      <polygon points="400,264 474,294 400,324 326,294"
               fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.0"/>
      <text x="400" y="291" fill="#2d3142" font-size="8.5" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Pilih halaman</text>
      <text x="400" y="303" fill="#7a8399" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">via sidebar</text>

      <!-- ── Branch LEFT: Pegawai ──────────── -->
      <!-- arrow left from diamond to Pegawai -->
      <path d="M 326 294 H 240 Q 220,294 220,314 V 368"
            fill="none" stroke="#4f5d75" stroke-width="1.0"
            marker-end="url(#uf-arr)"/>
      <!-- label -->
      <rect x="225" y="316" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="267" y="325" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Lihat Pegawai</text>

      <!--
        PEGAWAI page: cx=220, y=372..412 (w=156, h=40, x=142)
      -->
      <rect x="142" y="372" width="156" height="40" rx="6"
            fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="389" fill="#2d3142" font-size="11" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">/pegawai</text>
      <text x="220" y="403" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Daftar · Filter · Pagination</text>

      <!-- arrow: Pegawai → Detail (klik baris) -->
      <line x1="220" y1="412" x2="220" y2="464"
            stroke="#4f5d75" stroke-width="1.0" marker-end="url(#uf-arr)"/>
      <!-- label -->
      <rect x="148" y="428" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="437" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Pilih pegawai (klik baris)</text>

      <!--
        DETAIL PEGAWAI page: cx=220, y=468..508
      -->
      <rect x="142" y="468" width="156" height="40" rx="6"
            fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="485" fill="#2d3142" font-size="11" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">/pegawai/:nip</text>
      <text x="220" y="499" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Data lengkap satu pegawai</text>

      <!-- arrow: Detail → back to Pegawai (dashed, return) -->
      <path d="M 298 488 H 328 Q 340,488 340,476 V 392 Q 340,380 328,380 H 298"
            fill="none" stroke="#7a8399" stroke-width="0.9"
            stroke-dasharray="4,3" marker-end="url(#uf-arr-return)"/>
      <!-- label -->
      <rect x="343" y="426" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="369" y="435" fill="#7a8399" font-size="7.5"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Kembali</text>

      <!-- ── Branch RIGHT: Cuti ──────────── -->
      <!-- arrow right from diamond to Cuti -->
      <path d="M 474 294 H 556 Q 576,294 576,314 V 368"
            fill="none" stroke="#4f5d75" stroke-width="1.0"
            marker-end="url(#uf-arr)"/>
      <!-- label -->
      <rect x="490" y="316" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="526" y="325" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Lihat Cuti</text>

      <!--
        CUTI page: cx=576, y=372..412 (w=156, h=40, x=498)
      -->
      <rect x="498" y="372" width="156" height="40" rx="6"
            fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="576" y="389" fill="#2d3142" font-size="11" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">/cuti</text>
      <text x="576" y="403" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Rekap penggunaan cuti</text>

      <!-- ── Dashboard QuickSearch → Detail (shortcut) ──────────── -->
      <!--
        Shortcut arrow: from Dashboard (right edge) → Detail Pegawai.
        Verified: EmployeeQuickSearch.tsx onClick -> navigate('/pegawai/${nip}')
        Route: Dashboard directly to /pegawai/:nip
        Arrow runs right of main column then down.
      -->
      <path d="M 512 200 H 660 Q 672,200 672,212 V 484 Q 672,496 660,496 H 298"
            fill="none" stroke="#7a8399" stroke-width="0.9"
            stroke-dasharray="3,3" marker-end="url(#uf-arr-return)"/>
      <!-- shortcut label -->
      <rect x="676" y="334" width="84" height="24" rx="3" fill="#f5f5f5"/>
      <text x="718" y="345" fill="#7a8399" font-size="7.5"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">QuickSearch</text>
      <text x="718" y="355" fill="#7a8399" font-size="7.5"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">di Dashboard</text>

      <!-- ── MERGE + LOGOUT ────────────────────────────────────── -->

      <!-- merge dot at cx=400, y=570 — branches reconverge before logout -->
      <circle cx="400" cy="570" r="4" fill="#4f5d75"/>

      <!-- merge arrows from Pegawai area up to merge dot -->
      <!-- from Pegawai bottom (right side, avoiding Detail arrow) -->
      <path d="M 220 508 V 558 Q 220,570 232,570 H 396"
            fill="none" stroke="#4f5d75" stroke-width="0.9"
            marker-end="url(#uf-arr)"/>

      <!-- from Cuti bottom to merge dot -->
      <path d="M 576 412 V 558 Q 576,570 564,570 H 404"
            fill="none" stroke="#4f5d75" stroke-width="0.9"
            marker-end="url(#uf-arr)"/>

      <!-- from Dashboard (via re-navigation or direct action) — center path to merge -->
      <line x1="400" y1="324" x2="400" y2="566"
            stroke="rgba(45,49,66,0.12)" stroke-width="0.8"
            stroke-dasharray="2,4"/>
      <!-- small note: Dashboard juga bisa langsung ke merge -->

      <!-- LOGOUT action box: cx=400, y=590..630 -->
      <!-- arrow from merge dot → Logout -->
      <line x1="400" y1="574" x2="400" y2="614"
            stroke="#4f5d75" stroke-width="1.0" marker-end="url(#uf-arr)"/>
      <rect x="320" y="618" width="160" height="36" rx="6"
            fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="400" y="632" fill="#2d3142" font-size="10" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Logout</text>
      <text x="400" y="646" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.04em">Konfirmasi · sessionStorage dihapus</text>

      <!-- arrow: Logout → End -->
      <line x1="400" y1="654" x2="400" y2="700"
            stroke="#4f5d75" stroke-width="1.0" marker-end="url(#uf-arr)"/>

      <!--
        END (oval): cx=400, y=704..740
      -->
      <ellipse cx="400" cy="720" rx="52" ry="20"
               fill="rgba(45,49,66,0.08)" stroke="#4f5d75" stroke-width="1"/>
      <text x="400" y="725" fill="#4f5d75" font-size="10" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle"
            letter-spacing="0.06em">SELESAI</text>

      <!-- ─── LEGEND ──────────────────────────────────────────────── -->
      <line x1="28" y1="764" x2="772" y2="764"
            stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- legend items row 1 -->
      <text x="28" y="778" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">SHAPES</text>

      <!-- oval = start/end -->
      <ellipse cx="86" cy="775" rx="20" ry="9"
               fill="rgba(45,49,66,0.08)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="86" y="779" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace"
            text-anchor="middle">start/end</text>
      <text x="112" y="779" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">oval</text>

      <!-- rect = page -->
      <rect x="148" y="769" width="46" height="14" rx="3"
            fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="171" y="779" fill="#4f5d75" font-size="6" font-family="'Geist Mono', monospace"
            text-anchor="middle">halaman</text>
      <text x="200" y="779" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">rect</text>

      <!-- diamond = decision -->
      <polygon points="236,775 248,769 260,775 248,781"
               fill="#f5f5f5" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="268" y="779" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">keputusan</text>

      <!-- dot = merge -->
      <circle cx="356" cy="775" r="4" fill="#4f5d75"/>
      <text x="366" y="779" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">merge</text>

      <!-- legend items row 2 -->
      <text x="28" y="800" fill="#7a8399" font-size="6.5" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">FLOW</text>

      <!-- accent arrow -->
      <line x1="70" y1="797" x2="98" y2="797"
            stroke="#eb6c36" stroke-width="1.2" marker-end="url(#uf-arr-accent)"/>
      <text x="104" y="800" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">jalur utama</text>

      <!-- muted arrow -->
      <line x1="190" y1="797" x2="218" y2="797"
            stroke="#4f5d75" stroke-width="1.0" marker-end="url(#uf-arr)"/>
      <text x="224" y="800" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">navigasi</text>

      <!-- dashed return -->
      <line x1="300" y1="797" x2="328" y2="797"
            stroke="#7a8399" stroke-width="0.9" stroke-dasharray="4,3"
            marker-end="url(#uf-arr-return)"/>
      <text x="334" y="800" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">kembali / shortcut</text>

    </svg>
  </div>

  <div class="footer">
    <p>HRIS PPSDMPU · Application User Flow · diagram-design v2.6</p>
    <p>App.tsx · Sidebar.tsx · EmployeeTable.tsx · EmployeeQuickSearch.tsx · EmployeeDetail.tsx</p>
  </div>
</div>
</body>
</html>
